server:
  port: 8081

spring:
  application:
    name: library-backend
  datasource:
    url: jdbc:mysql://localhost:3307/library?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: your-mysql-password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.library.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.library.mapper: debug
